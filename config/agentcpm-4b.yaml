hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://./config/gpu_env
    - file://./config/retriever

defaults:
  - gpu_env: default
  - retriever: none
  - override hydra/hydra_logging: none
  - override hydra/job_logging: console_logging
  - _self_

model:
  # model arguments
  model_tag: "AgentCPM-4B"
  model_class: "AgentCPM"
  model_name_or_path: "openbmb/AgentCPM-Explore"
  attn_implementation: "flash_attention_2"
  use_cache: true
  max_turns: 4
  # max_gen_tokens: 2048
  max_gen_tokens: 1024

data:
  batch_size: ${gpu_env.data.batch_size}

training:
  # training arguments
  bf16: true
  seed: 42
  overwrite_output_dir: true

vllm:
  use_vllm: ${gpu_env.vllm.use_vllm}
  qa_model_gpu_memory_utilization: ${gpu_env.vllm.qa_model_gpu_memory_utilization}
  qa_model_max_model_len: ${gpu_env.vllm.qa_model_max_model_len}
  qa_model_max_num_seqs: ${gpu_env.vllm.qa_model_max_num_seqs}
